<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fcfbf7">
<title>한국고중세사 산책 · 기말 직전 정리</title>
<style>
:root{
  --bg:#fcfbf7;
  --card:#ffffff;
  --ink:#14181c;
  --mut:#6b747c;
  --line:#e7e3da;
  --line2:#d8d2c6;
  --chip:#f3f0e9;
  --acc:#0f766e;
  --accsoft:rgba(15,118,110,.09);
  --star:#c2761b;
  --cl:#b45309;
  --clbg:rgba(180,83,9,.10);
  --ppt:#2c5f8a;
  --pptbg:rgba(44,95,138,.09);
  --warnbg:rgba(194,118,27,.10);
  --e9:#0f766e;
  --e10:#b45309;
  --e11:#2c5f8a;
  --e12:#6b4a9e;
  --e13:#b03e63;
}
[data-theme="dark"]{
  --bg:#0b0d0f;
  --card:#12161a;
  --ink:#e9ecee;
  --mut:#98a2ab;
  --line:#232a30;
  --line2:#2e373f;
  --chip:#171c21;
  --acc:#63d6c9;
  --accsoft:rgba(99,214,201,.12);
  --star:#e0a45c;
  --cl:#f0b37e;
  --clbg:rgba(240,179,126,.12);
  --ppt:#8db8de;
  --pptbg:rgba(141,184,222,.12);
  --warnbg:rgba(224,164,92,.12);
  --e9:#63d6c9;
  --e10:#f0b37e;
  --e11:#8db8de;
  --e12:#c1a9e6;
  --e13:#ef9db6;
}
[data-theme="dark"]{--bg-soft:rgba(11,13,15,.86)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;
  font-size:15px;line-height:1.6;letter-spacing:-0.012em;
  transition:background .18s ease,color .18s ease;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
b{font-weight:700;color:var(--acc)}
.wrap{max-width:620px;margin:0 auto;min-height:100vh}
@media (min-width:700px){
  body{background:var(--chip)}
  [data-theme="dark"] body{background:#050708}
  .wrap{background:var(--bg);border-left:1px solid var(--line);border-right:1px solid var(--line)}
}
header{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:11px 16px 10px;background:var(--bg-soft);
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
}
.hd{flex:1;min-width:0}
.hd h1{margin:0;font-size:16px;font-weight:800;letter-spacing:-0.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd p{margin:1px 0 0;font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd{
  flex:0 0 auto;font-size:12px;font-weight:800;color:var(--acc);
  background:var(--accsoft);padding:5px 9px;border-radius:999px;letter-spacing:0;
}
.icon{
  flex:0 0 auto;width:34px;height:34px;border:0;border-radius:50%;background:transparent;
  display:flex;align-items:center;justify-content:center;
}
.icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic-sun{display:none}
[data-theme="dark"] .ic-sun{display:block}
[data-theme="dark"] .ic-moon{display:none}
.exam{
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  padding:9px 16px;border-bottom:1px solid var(--line);background:var(--bg);
}
.exam::-webkit-scrollbar{display:none}
.exam span{
  flex:0 0 auto;font-size:11.5px;color:var(--mut);background:var(--chip);
  padding:4px 9px;border-radius:999px;white-space:nowrap;
}
.exam span.k{color:var(--ink);font-weight:700;background:var(--accsoft)}
.tabs{
  position:sticky;top:56px;z-index:25;display:flex;gap:2px;
  padding:0 10px;background:var(--bg-soft);
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
}
.tab{
  flex:1;border:0;background:none;padding:13px 1px 11px;
  font-size:12.5px;color:var(--mut);position:relative;white-space:nowrap;
  letter-spacing:-0.04em;
}
.tab.on{color:var(--ink);font-weight:800}
.tab.on::after{content:"";position:absolute;left:6px;right:6px;bottom:0;height:3px;border-radius:3px;background:var(--acc)}
main{padding:0 0 56px}
.bar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:12px 16px 10px;font-size:12px;color:var(--mut);
}
.bar .cnt{margin-right:auto}
.bar .cnt b{color:var(--ink)}
.sw{
  border:1px solid var(--line2);background:var(--card);border-radius:999px;
  padding:5px 11px;font-size:12px;color:var(--mut);line-height:1.3;
}
.sw b{color:var(--ink);font-weight:700}
.sw.on{border-color:var(--acc);color:var(--acc);background:var(--accsoft)}
.sw.on b{color:var(--acc)}
.note{
  margin:0 16px 6px;padding:11px 13px;border-radius:14px;
  background:var(--chip);font-size:12.5px;line-height:1.65;color:var(--mut);
}
.note b{color:var(--ink)}
.flow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:12px 16px 4px}
.flow::-webkit-scrollbar{display:none}
.fch{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;
  border:1px solid var(--line2);background:var(--card);border-radius:12px;
  padding:7px 10px 7px 8px;font-size:12px;color:var(--ink);line-height:1.25;white-space:nowrap;
}
.fch .fnn{
  font-size:10.5px;font-weight:800;color:#fff;background:var(--acc);
  width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;
}
.fch.c10 .fnn{background:var(--e10)}
.fch.c11 .fnn{background:var(--e11)}
.fch.c12 .fnn{background:var(--e12)}
.fch.c13 .fnn{background:var(--e13)}
.far{flex:0 0 auto;align-self:center;color:var(--line2);font-size:11px}
.mapbar{display:flex;align-items:center;gap:5px;padding:10px 16px 6px;font-size:11.5px;color:var(--mut)}
.mapbar .hint{margin-right:auto;line-height:1.45;padding-right:6px}
.zbtn{
  flex:0 0 auto;border:1px solid var(--line2);background:var(--card);border-radius:8px;
  min-width:30px;height:27px;font-size:12px;color:var(--mut);line-height:1;padding:0 7px;
}
.zbtn:active{border-color:var(--acc);color:var(--acc)}
.mapw{padding:2px 8px 0;overflow-x:auto;overflow-y:hidden}
.map{width:100%;height:auto;display:block}
.map .mn{cursor:pointer}
.map .er{fill:var(--chip)}
.map .eb{opacity:.95}
.map .et{font-size:10.5px;font-weight:800;text-anchor:middle;fill:var(--mut);letter-spacing:0.02em}
.map .eh{font-size:15px;font-weight:800;text-anchor:middle;fill:var(--ink);letter-spacing:-0.045em}
.map .nr{fill:var(--card);stroke:var(--line2);stroke-width:1}
.map .nl{font-size:12px;text-anchor:middle;fill:var(--ink);letter-spacing:-0.03em}
.map .cn{stroke:var(--line2);stroke-width:1.1;fill:none}
.map .sp{stroke:var(--line2);stroke-width:1.3;fill:none}
.map .dot{fill:var(--line2)}
.map .mn:active .nr{stroke:var(--acc);stroke-width:1.6}
.map .e9 .eb{fill:var(--e9)}.map .e9 .et{fill:var(--e9)}
.map .e10 .eb{fill:var(--e10)}.map .e10 .et{fill:var(--e10)}
.map .e11 .eb{fill:var(--e11)}.map .e11 .et{fill:var(--e11)}
.map .e12 .eb{fill:var(--e12)}.map .e12 .et{fill:var(--e12)}
.map .e13 .eb{fill:var(--e13)}.map .e13 .et{fill:var(--e13)}
.sec{padding:20px 16px 2px}
.sec h2{margin:0;font-size:15px;font-weight:800;letter-spacing:-0.03em}
.sec .sub{margin:5px 0 0;font-size:12px;color:var(--mut);line-height:1.6;word-break:keep-all}
.chain{margin:10px 12px 12px;border:1px solid var(--line);border-radius:16px;background:var(--card);padding:14px 15px 4px}
.chain .ct{font-size:14px;font-weight:800;letter-spacing:-0.03em}
.chain .cq{font-size:11.5px;color:var(--mut);margin-top:3px;line-height:1.55}
.cs{display:flex;gap:9px;padding:12px 0 0;position:relative}
.cs .n{
  flex:0 0 19px;height:19px;border-radius:50%;background:var(--accsoft);color:var(--acc);
  font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.cs .b{flex:1;min-width:0}
.cs .b b{font-size:12.5px;display:block;letter-spacing:-0.025em;line-height:1.5}
.cs .b i{font-style:normal;display:block;font-size:11.5px;color:var(--mut);line-height:1.55;margin-top:2px;word-break:keep-all}
.cs:not(:last-child)::before{content:"";position:absolute;left:9px;top:33px;bottom:-10px;width:1px;background:var(--line2)}
.wk{padding:6px 0 2px}
.wkh{
  display:flex;align-items:baseline;gap:7px;padding:14px 16px 7px;
  position:sticky;top:var(--stick,137px);background:var(--bg);z-index:5;
}
.wkh .wn{font-size:12px;font-weight:800;color:var(--acc);letter-spacing:0.02em}
.wkh .wt{font-size:12.5px;color:var(--mut);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wkh .wc{font-size:11px;color:var(--mut)}
.trm{
  margin:0 12px 7px;padding:11px 13px;border:1px solid var(--line);border-radius:14px;
  background:var(--card);cursor:pointer;transition:border-color .14s ease,background .14s ease;
}
.trm:active{border-color:var(--acc)}
.trm .tt{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.trm .st{font-size:11px;color:var(--star);line-height:1}
.trm .tn{font-size:15.5px;font-weight:700;letter-spacing:-0.02em}
.bd{
  font-size:10px;font-weight:700;letter-spacing:0;padding:2px 6px;border-radius:5px;
  line-height:1.5;white-space:nowrap;
}
.bd.ppt{color:var(--ppt);background:var(--pptbg)}
.bd.cls{color:var(--cl);background:var(--clbg)}
.trm .td{margin-top:5px;font-size:13.5px;line-height:1.62;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere}
.trm .ez{margin-top:7px;padding:7px 10px;border-radius:10px;background:var(--chip);font-size:12.5px;line-height:1.6;color:var(--mut);word-break:keep-all}
.trm .ez em{font-style:normal;font-weight:800;color:var(--acc);margin-right:5px;font-size:10.5px}
.trm .tp{display:none;margin-left:auto;font-size:11px;color:var(--mut);opacity:.8}
.trm.hid{border-style:dashed;background:var(--chip)}
.trm.hid .td{display:none}
.trm.hid .ez{display:none}
.trm.hid .tp{display:inline}
.more{
  display:block;width:calc(100% - 24px);margin:2px 12px 8px;padding:10px;
  border:1px dashed var(--line2);border-radius:12px;background:transparent;
  font-size:12.5px;color:var(--mut);
}
.more:active{border-color:var(--acc);color:var(--acc)}
.story{margin:0 12px 12px;border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.shead{padding:14px 15px 0}
.stag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--acc);background:var(--accsoft);padding:3px 8px;border-radius:999px}
.shead h2{margin:8px 0 0;font-size:17.5px;line-height:1.38;letter-spacing:-0.035em;font-weight:800;word-break:keep-all}
.shead .hook{margin:7px 0 0;font-size:13px;line-height:1.65;color:var(--mut);word-break:keep-all}
.sflow{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:11px 15px 0}
.sflow .f{font-size:11.5px;font-weight:700;color:var(--acc);background:var(--accsoft);padding:3px 8px;border-radius:7px;letter-spacing:-0.03em}
.sflow .a{color:var(--mut);font-size:10px;opacity:.7}
.steps{padding:12px 15px 4px}
.step{display:flex;gap:10px;padding:9px 0}
.step .lb{
  flex:0 0 58px;font-size:11px;font-weight:800;color:var(--acc);
  padding-top:2px;letter-spacing:-0.02em;line-height:1.45;
}
.step .tx{flex:1;min-width:0;font-size:14px;line-height:1.72;word-break:keep-all;overflow-wrap:anywhere}
.step .tx b{background:var(--accsoft);padding:0 2px;border-radius:3px}
.keys{
  margin:8px 12px 14px;padding:11px 13px;border:1px dashed var(--line2);border-radius:13px;
  background:var(--bg);
}
.keys .kl{font-size:11px;font-weight:800;color:var(--star);letter-spacing:-0.01em}
.keys ul{margin:7px 0 0;padding:0;list-style:none}
.keys li{
  position:relative;padding-left:14px;font-size:13px;line-height:1.62;margin-bottom:4px;
  word-break:keep-all;
}
.keys li::before{content:"✓";position:absolute;left:0;top:0;font-size:11px;color:var(--acc);font-weight:800}
.keys li:last-child{margin-bottom:0}
.q{margin:0 12px 10px;border:1px solid var(--line);border-radius:15px;background:var(--card);padding:13px 14px}
.qtop{display:flex;align-items:center;gap:6px}
.qk{font-size:10.5px;font-weight:800;color:var(--acc);background:var(--accsoft);padding:2px 7px;border-radius:999px}
.qn{font-size:11.5px;color:var(--mut)}
.q p{margin:8px 0 0;font-size:14.5px;font-weight:600;line-height:1.6;word-break:keep-all}
.skel{margin:10px 0 0;padding:0;list-style:none}
.skel li{
  position:relative;padding-left:19px;font-size:13px;line-height:1.65;color:var(--mut);
  margin-bottom:4px;word-break:keep-all;
}
.skel li::before{
  content:"";position:absolute;left:0;top:4px;width:11px;height:11px;
  border:1.5px solid var(--line2);border-radius:3px;
}
.qbtn{
  margin-top:11px;border:1px solid var(--line2);background:var(--bg);border-radius:10px;
  padding:7px 12px;font-size:12.5px;color:var(--mut);
}
.q.on .qbtn{color:var(--acc);border-color:var(--acc)}
.ans{display:none;margin-top:11px;padding-top:10px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.7;word-break:keep-all}
.q.on .ans{display:block}
.ans .hint{display:block;margin-top:6px;font-size:12px;color:var(--cl)}
.ans b{background:var(--accsoft);padding:0 2px;border-radius:3px}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:620px;margin:0 auto;
  background:var(--card);border-top:1px solid var(--line2);
  border-radius:20px 20px 0 0;box-shadow:0 -10px 36px rgba(0,0,0,.16);
  padding:14px 18px calc(16px + env(safe-area-inset-bottom));
  transform:translateY(110%);transition:transform .24s cubic-bezier(.3,.9,.3,1);
  max-height:74vh;overflow-y:auto;visibility:hidden;
}
.sheet.on{transform:translateY(0);visibility:visible}
.shtop{display:flex;align-items:center;gap:8px}
.sheet h3{margin:9px 0 0;font-size:18px;letter-spacing:-0.04em;line-height:1.35;word-break:keep-all}
.sheet .sq{margin:5px 0 0;font-size:12.5px;color:var(--mut);line-height:1.55;word-break:keep-all}
.sheet .r{display:flex;gap:9px;margin-top:11px}
.sheet .r .lb{flex:0 0 34px;font-size:11px;font-weight:800;color:var(--acc);padding-top:3px;letter-spacing:-0.03em}
.sheet .r p{margin:0;flex:1;font-size:13.5px;line-height:1.66;word-break:keep-all}
.sheet .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
.sheet .chips span{font-size:11.5px;background:var(--warnbg);color:var(--star);padding:3px 9px;border-radius:999px;font-weight:700;letter-spacing:-0.02em}
.sheet .go{
  width:100%;margin-top:14px;border:1px solid var(--acc);background:var(--accsoft);color:var(--acc);
  border-radius:11px;padding:10px;font-size:13px;font-weight:800;
}
.sheet .x{margin-left:auto;border:0;background:var(--chip);width:29px;height:29px;border-radius:50%;color:var(--mut);font-size:13px;line-height:1}
.foot{padding:22px 20px 40px;text-align:center;font-size:11.5px;line-height:1.8;color:var(--mut)}
@media (max-width:360px){
  .tab{font-size:11.5px}
  .step .lb{flex:0 0 50px;font-size:10.5px}
}
</style>

<div class="wrap">

  </div>
  <div class="dd" id="dd">D-14</div>
  <button class="icon" id="th" aria-label="화면 모드 바꾸기">

    <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.1"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>

<div class="exam">

</div>
<nav class="tabs" id="tabs">

<main id="app"></main>

<script>
const MAP=[
{w:9,tag:"대외무역",chip:"바다로 연결",title:"고려, 바다로 세계와 연결되다",
q:"고려는 무엇을 팔아 무엇을 벌었나?",
one:"세금으로 걷은 곡식과 베가 예성항에 쌓이고, 송·원·일본·아랍 상인이 개경까지 올라온 200년짜리 교역망.",

keys:["예성항","원 교역","노걸대"],
nodes:[
{id:"n9a",side:"L",l1:"예성항 · 벽란도",w:9,one:"개경 옆 국제무역항. 외국 상인은 원칙적으로 여기서만 교역했다.",
why:"조세·공물 실은 배가 닿는 항구라 물건이 모였고, 개경을 지키려고 교역 장소를 한 곳으로 묶었음. 벽란도는 같은 곳의 다른 이름.",
keys:["예성항=국제무역항","외국 상인은 여기서만","벽란도=다른 이름"]},

const K="gomsa.v4";
let S={theme:"",mem:false,open:{},week:{},ans:{}};
let TAB=1;
let MZ=1;
let MAPS="";

function load(){
  try{
    const raw=localStorage.getItem(K);
    if(!raw) return;
    const p=JSON.parse(raw);
    if(!p||typeof p!=="object") return;
    S.theme=p.theme||"";
    S.mem=!!p.mem;
    S.open=p.open||{};
    S.week=p.week||{};
    S.ans=p.ans||{};
  }catch(e){}
}
function save(){
  try{localStorage.setItem(K,JSON.stringify(S));}catch(e){}
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function fmt(s){
  const parts=esc(s).split("**");
  let out="";
  for(let i=0;i<parts.length;i++){
    out+=(i%2===1)?"<b>"+parts[i]+"</b>":parts[i];
  }
  return out;
}
function buildMap(){
  if(MAPS) return MAPS;
  const W=420,CX=210;
  let y=12,g="",trunk="";
  MAP.forEach(function(e,ei){
    const L=e.nodes.filter(function(n){return n.side==="L";});
    const R=e.nodes.filter(function(n){return n.side==="R";});
    const rows=Math.max(L.length,R.length);
    const eraH=64;
    let s="";
    s+='<g class="mn e'+e.w+'" data-id="e'+ei+'">';
    s+='<rect class="er" x="40" y="'+y+'" width="340" height="'+eraH+'" rx="18"/>';
    s+='<rect class="eb" x="40" y="'+y+'" width="5" height="'+eraH+'" rx="2.5"/>';
    s+='<text class="et" x="'+(CX+3)+'" y="'+(y+24)+'">'+e.w+'주차 · '+e.tag+'</text>';
    s+='<text class="eh" x="'+(CX+3)+'" y="'+(y+47)+'">'+e.title+'</text>';
    s+='</g>';
    const top=y+eraH+26;
    const rowH=62;
    function place(list,side){
      let o="";
      list.forEach(function(n,i){
        const by=top+i*rowH;
        const bh=n.l2?56:44;
        const bx=(side==="L")?4:294;
        const cy=by+Math.round(bh/2);
        const ex=(side==="L")?126:294;
        o+='<path class="cn" d="M'+CX+' '+cy+' H'+ex+'"/>';
        o+='<circle class="dot" cx="'+CX+'" cy="'+cy+'" r="2.4"/>';
        o+='<g class="mn" data-id="'+n.id+'">';
        o+='<rect class="nr" x="'+bx+'" y="'+by+'" width="122" height="'+bh+'" rx="12"/>';
        if(n.l2){
          o+='<text class="nl" x="'+(bx+61)+'" y="'+(by+22)+'">'+n.l1+'</text>';
          o+='<text class="nl" x="'+(bx+61)+'" y="'+(by+39)+'">'+n.l2+'</text>';
        }else{
          o+='<text class="nl" x="'+(bx+61)+'" y="'+(by+27)+'">'+n.l1+'</text>';
        }
        o+='</g>';
      });
      return o;
    }
    g+=s+place(L,"L")+place(R,"R");
    const lastBottom=top+(rows-1)*rowH+56;
    const nextTop=lastBottom+34;
    trunk+='<path class="sp" d="M'+CX+' '+(y+eraH)+' V'+nextTop+'"/>';
    y=nextTop;
  });
  const H=y+14;
  MAPS='<svg class="map" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="고중세사 9주차부터 13주차까지 전체 흐름 마인드맵">'+trunk+g+'</svg>';
  return MAPS;
}
function findNode(id){
  if(id.charAt(0)==="e"){
    const i=parseInt(id.slice(1),10);
    const e=MAP[i];
    if(!e) return null;
    return {tag:e.w+"주차 · "+e.tag,title:e.title,q:e.q,one:e.one,why:e.why,keys:e.keys,w:e.w};
  }
  for(let i=0;i<MAP.length;i++){
    const n=MAP[i].nodes.filter(function(x){return x.id===id;})[0];
    if(n) return {tag:MAP[i].w+"주차 · "+MAP[i].tag,title:n.l1+(n.l2?" "+n.l2:""),q:"",one:n.one,why:n.why,keys:n.keys,w:n.w};
  }
  return null;
}
function tabMap(){
  let h='<div class="flow">';
  MAP.forEach(function(e,i){
    h+='<button class="fch c'+e.w+'" data-era="'+i+'"><span class="fnn">'+e.w+'</span>'+e.chip+'</button>';
    if(i<MAP.length-1) h+='<span class="far">→</span>';
  });
  h+='</div>';
  h+='<div class="mapbar"><span class="hint">굵은 띠가 주차, 양옆 상자가 그 주차의 핵심 갈래. 눌러서 <b>핵심·인과·키워드</b> 보기.</span>'+
    '<button class="zbtn" id="zo">－</button><button class="zbtn" id="zi">＋</button></div>';
  h+='<div class="mapw" id="mapw">'+buildMap()+'</div>';
  h+='<div class="sec"><h2>핵심 인과 사슬 3개</h2><p class="sub">시대를 관통하는 세 줄기만 잡으면 총체적으로 이해된다. 서술형은 이 세 줄기에서 나온다.</p></div>';
  CHAINS.forEach(function(c){
    h+='<div class="chain"><div class="ct">'+c.ct+'</div><div class="cq">'+c.cq+'</div>';
    c.steps.forEach(function(st,i){
      h+='<div class="cs"><span class="n">'+(i+1)+'</span><div class="b"><b>'+fmt(st[0])+'</b><i>'+fmt(st[1])+'</i></div></div>';
    });
    h+='</div>';
  });
  return h;
}
function termHTML(x,id){
  const hid=S.mem&&!S.open[id];
  let h='<div class="trm'+(hid?' hid':'')+'" data-id="'+id+'" role="button" tabindex="0">';
  h+='<div class="tt">';
  if(x.s) h+='<span class="st">★</span>';
  h+='<span class="tn">'+fmt(x.n)+'</span>';
  h+='<span class="bd '+(x.b==="cls"?"cls":"ppt")+'">'+(x.b==="cls"?"🎙 함정":"PPT")+'</span>';
  h+='<span class="tp">눌러서 확인</span>';
  h+='</div>';
  h+='<div class="td">'+fmt(x.d)+'</div>';
  if(x.e) h+='<div class="ez"><em>쉽게</em>'+fmt(x.e)+'</div>';
  h+='</div>';
  return h;
}
function tab1(){
  const total=WEEKS.reduce(function(a,w){return a+w.items.length;},0);
  const core=WEEKS.reduce(function(a,w){return a+w.items.filter(function(x){return x.s;}).length;},0);
  const hiddenCnt=WEEKS.reduce(function(a,w,wi){return a+w.items.filter(function(x,i){return S.mem&&!S.open[wi+"-"+i];}).length;},0);
  let h='<div class="bar">'+
    '<span class="cnt"><b>'+total+'</b>개 · ★핵심 <b>'+core+'</b></span>'+
    '<button class="sw'+(S.mem?' on':'')+'" id="mem"><b>'+(S.mem?'암기 모드 ON':'암기 모드 OFF')+'</b></button>'+
    '<button class="sw" id="allw">'+(S.mem&&hiddenCnt===0?'모두 가리기':'모두 펼치기')+'</button>'+
    '</div>';
  h+='<div class="note">약술 5문제는 <b>용어 + 핵심 기능 한 줄</b>로 채점됨. ★만 먼저 훑고, 회색 <b>쉽게</b> 칸으로 뜻을 잡은 뒤 <b>🎙 함정</b>을 보면 됨 — 에브리타임 족보 기준 5개 중 1개가 여기서 나옴.</div>';
  WEEKS.forEach(function(w,wi){
    h+='<section class="wk" id="wk'+w.w+'"><div class="wkh"><span class="wn">'+w.w+'주차</span><span class="wt">'+w.title+'</span><span class="wc">'+w.items.length+'</span></div>';
    w.items.forEach(function(x,i){
      if(x.s) h+=termHTML(x,wi+"-"+i);
    });
    const rest=w.items.filter(function(x){return !x.s;});
    if(rest.length){
      const op=!!S.week[wi];
      h+='<button class="more" data-w="'+wi+'">'+(op?'－ 디테일 접기':'＋ 함정·디테일 '+rest.length+'개 더 보기')+'</button>';
      if(op){
        w.items.forEach(function(x,i){
          if(!x.s) h+=termHTML(x,wi+"-"+i);
        });
      }
    }
    h+='</section>';
  });
  return h;
}
function tab2(){
  let h='<div class="note">서술형은 <b>왜 터짐 → 어떻게 굴러감 → 결국 뭐가 바뀜</b> 순서로 외우면 안 까먹음. 위 <b>흐름 칩</b>만 줄줄 외워도 뼈대가 잡히고, 끝 <b>감점 방지 키워드</b>는 답안지에 반드시 넣기.</div>';
  STORIES.forEach(function(s){
    h+='<article class="story"><div class="shead"><span class="stag">'+s.tag+'</span><h2>'+fmt(s.title)+'</h2><p class="hook">'+fmt(s.hook)+'</p></div>';
    h+='<div class="sflow">';
    s.flow.forEach(function(f,i){
      h+='<span class="f">'+fmt(f)+'</span>';
      if(i<s.flow.length-1) h+='<span class="a">→</span>';
    });
    h+='</div>';
    h+='<div class="steps">';
    s.steps.forEach(function(st){
      h+='<div class="step"><div class="lb">'+st[0]+'</div><div class="tx">'+fmt(st[1])+'</div></div>';
    });
    h+='</div>';
    h+='<div class="keys"><div class="kl">🚩 감점 방지 필수 키워드</div><ul>';
    s.keys.forEach(function(k){h+='<li>'+fmt(k)+'</li>';});
    h+='</ul></div></article>';
  });
  return h;
}
function tab3(){
  let h='<div class="note">기출 구성 그대로 <b>약술 5 + 서술 2</b>. 답을 머릿속으로 한 줄 써 보고 눌러서 채점 기준과 비교해 보기.</div>';
  QS.forEach(function(q,i){
    const id="q"+i;
    const on=!!S.ans[id];
    h+='<div class="q'+(on?' on':'')+'" data-id="'+id+'">';
    h+='<div class="qtop"><span class="qk">'+q.k+'</span><span class="qn">'+q.n+'번</span></div>';
    h+='<p>'+fmt(q.q)+'</p>';
    if(q.skel){
      h+='<ul class="skel">';
      q.skel.forEach(function(s){h+='<li>'+fmt(s)+'</li>';});
      h+='</ul>';
    }
    h+='<button class="qbtn">'+(on?"채점 기준 접기":"채점 기준 보기")+'</button>';
    h+='<div class="ans">'+fmt(q.a)+'<span class="hint">⚠ '+fmt(q.hint)+'</span></div>';
    h+='</div>';
  });
  return h;
}
function stickTop(){
  const t=document.querySelector(".tabs");
  if(!t) return;
  const b=Math.round(t.getBoundingClientRect().bottom);
  document.documentElement.style.setProperty("--stick",b+"px");
}
function render(){
  const app=document.getElementById("app");
  if(TAB===1) app.innerHTML=tabMap();
  else if(TAB===2) app.innerHTML=tab1();
  else if(TAB===3) app.innerHTML=tab2();
  else app.innerHTML=tab3();
  if(TAB===1) applyZoom();
  stickTop();
}
function applyZoom(){
  const svg=document.querySelector(".mapw svg");
  if(svg) svg.style.width=(MZ*100)+"%";
}
function selectTab(n){
  closeSheet();
  TAB=n;
  document.querySelectorAll(".tab").forEach(function(x){
    x.classList.toggle("on",parseInt(x.getAttribute("data-t"),10)===n);
  });
  render();
}
function dday(){
  const exam=new Date("2026-12-08T12:00:00+09:00").getTime();
  const now=Date.now();
  const d=Math.ceil((exam-now)/86400000);
  if(d>0) return "D-"+d;
  if(d===0) return "D-DAY";
  return "종료";
}
function applyTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content",t==="dark"?"#0b0d0f":"#fcfbf7");
}
function openSheet(id){
  const d=findNode(id);
  if(!d) return;
  const sh=document.getElementById("sheet");
  let h='<div class="shtop"><span class="stag">'+d.tag+'</span><button class="x" id="sx" aria-label="닫기">✕</button></div>';
  h+='<h3>'+fmt(d.title)+'</h3>';
  if(d.q) h+='<p class="sq">'+fmt(d.q)+'</p>';
  h+='<div class="r"><span class="lb">한 줄</span><p>'+fmt(d.one)+'</p></div>';
  h+='<div class="r"><span class="lb">인과</span><p>'+fmt(d.why)+'</p></div>';
  if(d.keys&&d.keys.length){
    h+='<div class="chips">';
    d.keys.forEach(function(k){h+='<span>'+fmt(k)+'</span>';});
    h+='</div>';
  }
  h+='<button class="go" data-go="'+d.w+'">'+d.w+'주차 약술에서 자세히 보기 →</button>';
  sh.innerHTML=h;
  sh.classList.add("on");
  sh.setAttribute("aria-hidden","false");
}
function closeSheet(){
  const sh=document.getElementById("sheet");
  if(!sh) return;
  sh.classList.remove("on");
  sh.setAttribute("aria-hidden","true");
}
function goWeek(w){
  closeSheet();
  selectTab(2);
  window.requestAnimationFrame(function(){
    const el=document.getElementById("wk"+w);
    if(!el) return;
    const r=el.getBoundingClientRect();
    window.scrollTo({top:window.scrollY+r.top-140,behavior:"smooth"});
  });
}
document.getElementById("tabs").addEventListener("click",function(e){
  const b=e.target.closest(".tab");
  if(!b) return;
  selectTab(parseInt(b.getAttribute("data-t"),10)||1);
  window.scrollTo({top:0,behavior:"smooth"});
});
document.getElementById("app").addEventListener("click",function(e){
  const nd=e.target.closest(".mn");
  if(nd&&document.getElementById("mapw")&&document.getElementById("mapw").contains(nd)){
    openSheet(nd.getAttribute("data-id"));
    return;
  }
  const ch=e.target.closest(".fch");
  if(ch){
    const i=parseInt(ch.getAttribute("data-era"),10);
    const g=document.querySelector('.map .e'+MAP[i].w);
    if(g){
      const r=g.getBoundingClientRect();
      window.scrollTo({top:window.scrollY+r.top-190,behavior:"smooth"});
    }else{
      openSheet("e"+i);
    }
    return;
  }
  const zi=e.target.closest("#zi");
  if(zi){
    MZ=Math.min(2.4,Math.round((MZ+0.35)*100)/100);
    applyZoom();
    return;
  }
  const zo=e.target.closest("#zo");
  if(zo){
    MZ=Math.max(0.7,Math.round((MZ-0.35)*100)/100);
    applyZoom();
    return;
  }
  const trm=e.target.closest(".trm");
  if(trm){
    if(!S.mem) return;
    const id=trm.getAttribute("data-id");
    if(S.open[id]) delete S.open[id];
    else S.open[id]=true;
    save();
    trm.classList.toggle("hid",!S.open[id]);
    return;
  }
  const more=e.target.closest(".more");
  if(more){
    const wi=more.getAttribute("data-w");
    if(S.week[wi]) delete S.week[wi];
    else S.week[wi]=true;
    save();
    render();
    return;
  }
  const mem=e.target.closest("#mem");
  if(mem){S.mem=!S.mem;save();render();return;}
  const allw=e.target.closest("#allw");
  if(allw){
    if(!S.mem){S.mem=true;S.open={};}
    else{
      let hidden=false;
      WEEKS.forEach(function(w,wi){w.items.forEach(function(x,i){if(!S.open[wi+"-"+i]) hidden=true;});});
      if(hidden){WEEKS.forEach(function(w,wi){w.items.forEach(function(x,i){S.open[wi+"-"+i]=true;});});}
      else{S.open={};}
    }
    save();render();return;
  }
  const q=e.target.closest(".q");
  if(q){
    const id=q.getAttribute("data-id");
    if(S.ans[id]) delete S.ans[id];
    else S.ans[id]=true;
    save();
    q.classList.toggle("on",!!S.ans[id]);
    const btn=q.querySelector(".qbtn");
    if(btn) btn.textContent=S.ans[id]?"채점 기준 접기":"채점 기준 보기";
    return;
  }
});
document.getElementById("app").addEventListener("keydown",function(e){
  const trm=e.target.closest(".trm");
  if(!trm) return;
  if(e.key==="Enter"||e.key===" "){e.preventDefault();trm.click();}
});
document.getElementById("sheet").addEventListener("click",function(e){
  if(e.target.closest("#sx")){closeSheet();return;}
  const go=e.target.closest(".go");
  if(go){goWeek(parseInt(go.getAttribute("data-go"),10));return;}
});
document.getElementById("th").addEventListener("click",function(){
  const cur=document.documentElement.getAttribute("data-theme")==="dark"?"dark":"light";
  const next=cur==="dark"?"light":"dark";
  S.theme=next;
  applyTheme(next);
  save();
});
load();
let th=S.theme;
if(!th) th=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
applyTheme(th);
document.getElementById("dd").textContent=dday();
render();
window.addEventListener("resize",stickTop);
</script>
</body>
