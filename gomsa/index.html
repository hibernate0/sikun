<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fcfbf7">
<title>한국고중세사 산책 · 기말 직전 정리</title>
<style>
:root{
  --bg:#fcfbf7;
  --card:#ffffff;
  --ink:#14181c;
  --mut:#6b747c;
  --line:#e7e3da;
  --line2:#d8d2c6;
  --chip:#f3f0e9;
  --acc:#0f766e;
  --accsoft:rgba(15,118,110,.09);
  --star:#c2761b;
  --cl:#b45309;
  --clbg:rgba(180,83,9,.10);
  --ppt:#2c5f8a;
  --pptbg:rgba(44,95,138,.09);
  --warnbg:rgba(194,118,27,.10);
}
[data-theme="dark"]{
  --bg:#0b0d0f;
  --card:#12161a;
  --ink:#e9ecee;
  --mut:#98a2ab;
  --line:#232a30;
  --line2:#2e373f;
  --chip:#171c21;
  --acc:#63d6c9;
  --accsoft:rgba(99,214,201,.12);
  --star:#e0a45c;
  --cl:#f0b37e;
  --clbg:rgba(240,179,126,.12);
  --ppt:#8db8de;
  --pptbg:rgba(141,184,222,.12);
  --warnbg:rgba(224,164,92,.12);
  --bg-soft:#0b0d0f;
}
[data-theme="dark"]{--bg-soft:rgba(11,13,15,.86)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;
  font-size:15px;line-height:1.6;letter-spacing:-0.012em;
  transition:background .18s ease,color .18s ease;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
b{font-weight:700;color:var(--acc)}
.wrap{max-width:620px;margin:0 auto;min-height:100vh}
@media (min-width:700px){
  body{background:var(--chip)}
  [data-theme="dark"] body{background:#050708}
  .wrap{background:var(--bg);border-left:1px solid var(--line);border-right:1px solid var(--line)}
}
header{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:11px 16px 10px;background:var(--bg-soft);
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
}
.hd{flex:1;min-width:0}
.hd h1{margin:0;font-size:16px;font-weight:800;letter-spacing:-0.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd p{margin:1px 0 0;font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd{
  flex:0 0 auto;font-size:12px;font-weight:800;color:var(--acc);
  background:var(--accsoft);padding:5px 9px;border-radius:999px;letter-spacing:0;
}
.icon{
  flex:0 0 auto;width:34px;height:34px;border:0;border-radius:50%;background:transparent;
  display:flex;align-items:center;justify-content:center;
}
.icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic-sun{display:none}
[data-theme="dark"] .ic-sun{display:block}
[data-theme="dark"] .ic-moon{display:none}
.exam{
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  padding:9px 16px;border-bottom:1px solid var(--line);background:var(--bg);
}
.exam::-webkit-scrollbar{display:none}
.exam span{
  flex:0 0 auto;font-size:11.5px;color:var(--mut);background:var(--chip);
  padding:4px 9px;border-radius:999px;white-space:nowrap;
}
.exam span.k{color:var(--ink);font-weight:700;background:var(--accsoft)}
.tabs{
  position:sticky;top:56px;z-index:25;display:flex;gap:2px;
  padding:0 10px;background:var(--bg-soft);
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
}
.tab{
  flex:1;border:0;background:none;padding:13px 2px 11px;
  font-size:13px;color:var(--mut);position:relative;white-space:nowrap;
  letter-spacing:-0.03em;
}
.tab.on{color:var(--ink);font-weight:800}
.tab.on::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:3px;border-radius:3px;background:var(--acc)}
main{padding:0 0 56px}
.bar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:12px 16px 10px;font-size:12px;color:var(--mut);
}
.bar .cnt{margin-right:auto}
.bar .cnt b{color:var(--ink)}
.sw{
  border:1px solid var(--line2);background:var(--card);border-radius:999px;
  padding:5px 11px;font-size:12px;color:var(--mut);line-height:1.3;
}
.sw b{color:var(--ink);font-weight:700}
.sw.on{border-color:var(--acc);color:var(--acc);background:var(--accsoft)}
.sw.on b{color:var(--acc)}
.note{
  margin:0 16px 6px;padding:11px 13px;border-radius:14px;
  background:var(--chip);font-size:12.5px;line-height:1.65;color:var(--mut);
}
.note b{color:var(--ink)}
.wk{padding:6px 0 2px}
.wkh{
  display:flex;align-items:baseline;gap:7px;padding:14px 16px 7px;
  position:sticky;top:var(--stick,137px);background:var(--bg);z-index:5;
}
.wkh .wn{font-size:12px;font-weight:800;color:var(--acc);letter-spacing:0.02em}
.wkh .wt{font-size:12.5px;color:var(--mut);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wkh .wc{font-size:11px;color:var(--mut)}
.trm{
  margin:0 12px 7px;padding:11px 13px;border:1px solid var(--line);border-radius:14px;
  background:var(--card);cursor:pointer;transition:border-color .14s ease,background .14s ease;
}
.trm:active{border-color:var(--acc)}
.trm .tt{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.trm .st{font-size:11px;color:var(--star);line-height:1}
.trm .tn{font-size:15.5px;font-weight:700;letter-spacing:-0.02em}
.bd{
  font-size:10px;font-weight:700;letter-spacing:0;padding:2px 6px;border-radius:5px;
  line-height:1.5;white-space:nowrap;
}
.bd.ppt{color:var(--ppt);background:var(--pptbg)}
.bd.cls{color:var(--cl);background:var(--clbg)}
.trm .td{margin-top:5px;font-size:13.5px;line-height:1.62;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere}
.trm .tp{display:none;margin-left:auto;font-size:11px;color:var(--mut);opacity:.8}
.trm.hid{border-style:dashed;background:var(--chip)}
.trm.hid .td{display:none}
.trm.hid .tp{display:inline}
.more{
  display:block;width:calc(100% - 24px);margin:2px 12px 8px;padding:10px;
  border:1px dashed var(--line2);border-radius:12px;background:transparent;
  font-size:12.5px;color:var(--mut);
}
.more:active{border-color:var(--acc);color:var(--acc)}
.story{margin:0 12px 12px;border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.shead{padding:14px 15px 0}
.stag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--acc);background:var(--accsoft);padding:3px 8px;border-radius:999px}
.shead h2{margin:8px 0 0;font-size:17.5px;line-height:1.38;letter-spacing:-0.035em;font-weight:800;word-break:keep-all}
.shead .hook{margin:7px 0 0;font-size:13px;line-height:1.65;color:var(--mut);word-break:keep-all}
.steps{padding:12px 15px 4px}
.step{display:flex;gap:10px;padding:9px 0}
.step .lb{
  flex:0 0 58px;font-size:11px;font-weight:800;color:var(--acc);
  padding-top:2px;letter-spacing:-0.02em;line-height:1.45;
}
.step .tx{flex:1;min-width:0;font-size:14px;line-height:1.72;word-break:keep-all;overflow-wrap:anywhere}
.step .tx b{background:var(--accsoft);padding:0 2px;border-radius:3px}
.keys{
  margin:8px 12px 14px;padding:11px 13px;border:1px dashed var(--line2);border-radius:13px;
  background:var(--bg);
}
.keys .kl{font-size:11px;font-weight:800;color:var(--star);letter-spacing:-0.01em}
.keys ul{margin:7px 0 0;padding:0;list-style:none}
.keys li{
  position:relative;padding-left:14px;font-size:13px;line-height:1.62;margin-bottom:4px;
  word-break:keep-all;
}
.keys li::before{content:"✓";position:absolute;left:0;top:0;font-size:11px;color:var(--acc);font-weight:800}
.keys li:last-child{margin-bottom:0}
.q{margin:0 12px 10px;border:1px solid var(--line);border-radius:15px;background:var(--card);padding:13px 14px}
.qtop{display:flex;align-items:center;gap:6px}
.qk{font-size:10.5px;font-weight:800;color:var(--acc);background:var(--accsoft);padding:2px 7px;border-radius:999px}
.qn{font-size:11.5px;color:var(--mut)}
.q p{margin:8px 0 0;font-size:14.5px;font-weight:600;line-height:1.6;word-break:keep-all}
.skel{margin:10px 0 0;padding:0;list-style:none}
.skel li{
  position:relative;padding-left:19px;font-size:13px;line-height:1.65;color:var(--mut);
  margin-bottom:4px;word-break:keep-all;
}
.skel li::before{
  content:"";position:absolute;left:0;top:4px;width:11px;height:11px;
  border:1.5px solid var(--line2);border-radius:3px;
}
.qbtn{
  margin-top:11px;border:1px solid var(--line2);background:var(--bg);border-radius:10px;
  padding:7px 12px;font-size:12.5px;color:var(--mut);
}
.q.on .qbtn{color:var(--acc);border-color:var(--acc)}
.ans{display:none;margin-top:11px;padding-top:10px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.7;word-break:keep-all}
.q.on .ans{display:block}
.ans .hint{display:block;margin-top:6px;font-size:12px;color:var(--cl)}
.ans b{background:var(--accsoft);padding:0 2px;border-radius:3px}
.foot{padding:22px 20px 40px;text-align:center;font-size:11.5px;line-height:1.8;color:var(--mut)}
@media (max-width:360px){
  .tab{font-size:12px}
  .step .lb{flex:0 0 50px;font-size:10.5px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="hd">
    <h1>한국고중세사 산책</h1>
    <p>기말 범위 9~14주차 · 정리 9~13주차</p>
  </div>
  <div class="dd" id="dd">D-14</div>
  <button class="icon" id="th" aria-label="화면 모드 바꾸기">
    <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.1"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>
  </button>
</header>
<div class="exam">
  <span class="k">12/08(화) 12:00</span>
  <span>어의관 308</span>
  <span>50분</span>
  <span>주관식 · 볼펜</span>
  <span>약술 5 + 서술 2</span>
</div>
<nav class="tabs" id="tabs">
  <button class="tab on" data-t="1">⚡ 약술 암기장</button>
  <button class="tab" data-t="2">🧠 빅스토리</button>
  <button class="tab" data-t="3">✍️ 미니 체크</button>
</nav>
<main id="app"></main>
<div class="foot">강의안 9~13주차 + 13주차 수업 녹음 반영 · 14주차 자료 나오면 추가<br>암기 모드는 기기에 저장돼서 다시 열어도 유지됩니다</div>
</div>
<script>
const WEEKS=[

{w:11,title:"세종대 문화융성과 민본정치",items:[

{n:"집현전",b:"ppt",s:1,d:"고제를 연구해 제도를 만들고, 유교 정치를 맡을 유학자군을 양성."},
{n:"공법",b:"ppt",d:"17년 토론 끝에 시행. 세종 공론정치의 대표 사례."},
{n:"황찬",b:"ppt",d:"요동에 귀양 온 명 한림학사. 음운을 13번 자문받았다."},
{n:"언해청",b:"ppt",d:"훈민정음을 만들기 위해 설치한 기구."},
{n:"삼강",b:"ppt",s:1,d:"군위신강·부위자강·부위부강. 상하 질서를 설명한다."},
{n:"오륜",b:"ppt",s:1,d:"군신유의·부자유친·부부유별·장유유서·붕우유신. 관계를 조화시킨다."},
{n:"예악",b:"ppt",d:"예는 인간관계 질서의 형식화, 악은 조화의 상징이자 교화 수단."},

hint:"‘국가가 세운 여관’으로 쓰면 0점. 건립 주체가 사원이라는 게 채점 포인트."},
{k:"약술",n:2,q:"‘모수사패’란?",
a:"원 간섭기에 **사패를 함부로 받아내는 것**. 사패는 전쟁으로 땅이 없을 때 **개간과 전시과 지급을 합쳐** 준 토지인데, 이게 남발되면서 **농장(대토지)**이 형성됐다.",
hint:"사패의 정의(개간+전시과)를 빼고 ‘토지 받는 것’만 쓰면 점수가 깎임."},
{k:"약술",n:3,q:"《노걸대》란?",
a:"**원대 중기 고려에서 만든 중국어 회화 교재**(106개 상황). 고려 상인이 **문인**을 들고 대도에 가 물건을 팔고 **보초**를 받는 과정이 담겨, **원과의 교역이 중요하고 발달**했음을 보여준다.",
hint:"교재라는 사실만 쓰면 절반. ‘교역 발달을 증명하는 사료’라는 기능까지 써야 함."},
{k:"약술",n:4,q:"‘양전’이란?",
a:"**토지를 측량해 소유주와 면적을 파악**하는 것. 겸병·탈점으로 흐트러진 소유 관계를 국가가 다시 정리하고 **조세 수취 기반**을 확보했다.",
hint:"교안에는 ‘전국 토지 측량’으로만 나옴. 용어 자체를 물으면 이 한 줄이 답."},
{k:"약술",n:5,q:"‘아관(亞官)’이란?",
a:"**향안에 기재된 양반**이 지방 행정에 직간접으로 영향력을 행사한 것. ‘버금 관료’라는 뜻.",
hint:"향안=명부, 아관=그 명부에 오른 사람의 지위. 둘을 바꿔 쓰면 오답."},
{k:"서술",n:6,q:"세종이 정착시키고자 했던 지배체제와 그 방법·정책을 서술하시오. (10점)",
skel:["배경: 태종이 의정부+6조, 사병→공병, 양전, 노비소송으로 골격 완성 후 양위",
"방향: 성리학 기반 중앙집권체제 + 예악(질서와 조화)",
"윤리: 삼강=상하 질서 / 오륜=관계 조화 + 명분론·직분론",
"방법: 집현전(고제 연구·유학자 양성), 공론(공법 17년), 능력 기용(장영실·황희)",
"정책: 경제육전·국조오례의, 공법·농사직설, 훈민정음(1443→1446), 4군 6진",
"의의: 왕도정치·민본정치, 백성 교화와 효율적 국가 운영"],
a:"필수 키워드: **성리학 기반 중앙집권체제**, **예악**, **삼강오륜**, **집현전**, **공론(공법 17년)**, **훈민정음의 통치 목적**.",
hint:"업적만 나열하고 ‘왜 그렇게 했는지’를 빼면 감점. 훈민정음을 순수 학문 목적이라고 쓰면 크게 감점."},
{k:"서술",n:7,q:"조선 후기 신분제와 지주제가 붕괴되는 양상과 한국사에 미친 영향을 서술하시오. (15점)",
skel:["두 축: 신분제와 지주제(수조권은 경기도에 국한)",
"농업: 이앙법→이모작·노동력 절감, 견종법·시비법, 상품작물",
"분화: 몰락 농민은 고공, 성장한 농민은 경영형 부농",
"지주제: 항조 → 도조법(정액지대)으로 전환",
"신분제: 납속·속량, 납속첩·공명첩, 족보 매매, 잔반 / 양인·노비 감소, 양반 증가",
"정치·향촌: 수조권 소멸, 사족지배체제 약화, 수령권 강화, 신향과 향전",
"영향: 중세사회 해체, 실학(신분제 폐지·권력 평등, 중농/중상)"],
a:"필수 키워드: **이앙법**, **항조→도조법**, **납속첩·공명첩·족보**, **양인·노비 감소와 양반 증가**, **사족지배체제 붕괴**, **실학**.",
hint:"‘양상’만 쓰고 ‘영향’을 빼면 절반. 실학을 인물 이름만 나열하면 감점 — 신분제 폐지·권력 평등이라는 방향을 써야 함."}
];

const K="gomsa.v3";
let S={theme:"",mem:false,open:{},week:{},ans:{}};
let TAB=1;

function load(){
  try{
    const raw=localStorage.getItem(K);
    if(!raw) return;
    const p=JSON.parse(raw);
    if(!p||typeof p!=="object") return;
    S.theme=p.theme||"";
    S.mem=!!p.mem;
    S.open=p.open||{};
    S.week=p.week||{};
    S.ans=p.ans||{};
  }catch(e){}
}
function save(){
  try{localStorage.setItem(K,JSON.stringify(S));}catch(e){}
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function fmt(s){
  const parts=esc(s).split("**");
  let out="";
  for(let i=0;i<parts.length;i++){
    out+=(i%2===1)?"<b>"+parts[i]+"</b>":parts[i];
  }
  return out;
}
function termHTML(x,id){
  const hid=S.mem&&!S.open[id];
  let h='<div class="trm'+(hid?' hid':'')+'" data-id="'+id+'" role="button" tabindex="0">';
  h+='<div class="tt">';
  if(x.s) h+='<span class="st">★</span>';
  h+='<span class="tn">'+fmt(x.n)+'</span>';
  h+='<span class="bd '+(x.b==="cls"?"cls":"ppt")+'">'+(x.b==="cls"?"🎙 함정":"PPT")+'</span>';
  h+='<span class="tp">눌러서 확인</span>';
  h+='</div>';
  h+='<div class="td">'+fmt(x.d)+'</div>';
  h+='</div>';
  return h;
}
function tab1(){
  const total=WEEKS.reduce((a,w)=>a+w.items.length,0);
  const core=WEEKS.reduce((a,w)=>a+w.items.filter(x=>x.s).length,0);
  const hiddenCnt=WEEKS.reduce(function(a,w,wi){return a+w.items.filter(function(x,i){return S.mem&&!S.open[wi+"-"+i];}).length;},0);
  let h='<div class="bar">'+
    '<span class="cnt"><b>'+total+'</b>개 · ★핵심 <b>'+core+'</b></span>'+
    '<button class="sw'+(S.mem?' on':'')+'" id="mem"><b>'+(S.mem?'암기 모드 ON':'암기 모드 OFF')+'</b></button>'+
    '<button class="sw" id="allw">'+(S.mem&&hiddenCnt===0?'모두 가리기':'모두 펼치기')+'</button>'+
    '</div>';
  h+='<div class="note">약술 5문제는 <b>용어 + 핵심 기능 한 줄</b>로 채점됨. ★만 먼저 훑고, <b>🎙 함정</b>은 교안에서 놓치기 쉬운 디테일이나 교수님이 말로 짚어낸 것 — 에브리타임 족보 기준 5개 중 1개가 여기서 나옴.</div>';
  WEEKS.forEach(function(w,wi){
    h+='<section class="wk"><div class="wkh"><span class="wn">'+w.w+'주차</span><span class="wt">'+w.title+'</span><span class="wc">'+w.items.length+'</span></div>';
    w.items.forEach(function(x,i){
      if(x.s) h+=termHTML(x,wi+"-"+i);
    });
    const rest=w.items.filter(function(x){return !x.s;});
    if(rest.length){
      const op=!!S.week[wi];
      h+='<button class="more" data-w="'+wi+'">'+(op?'－ 디테일 접기':'＋ 함정·디테일 '+rest.length+'개 더 보기')+'</button>';
      if(op){
        w.items.forEach(function(x,i){
          if(!x.s) h+=termHTML(x,wi+"-"+i);
        });
      }
    }
    h+='</section>';
  });
  return h;
}
function tab2(){
  let h='<div class="note">서술형은 <b>왜 터짐 → 어떻게 굴러감 → 결국 뭐가 바뀜</b> 순서로 외우면 안 까먹음. 각 스토리 끝 <b>감점 방지 키워드</b>는 답안지에 반드시 넣기.</div>';
  STORIES.forEach(function(s){
    h+='<article class="story"><div class="shead"><span class="stag">'+s.tag+'</span><h2>'+fmt(s.title)+'</h2><p class="hook">'+fmt(s.hook)+'</p></div><div class="steps">';
    s.steps.forEach(function(st){
      h+='<div class="step"><div class="lb">'+st[0]+'</div><div class="tx">'+fmt(st[1])+'</div></div>';
    });
    h+='</div>';
    h+='<div class="keys"><div class="kl">🚩 감점 방지 필수 키워드</div><ul>';
    s.keys.forEach(function(k){h+='<li>'+fmt(k)+'</li>';});
    h+='</ul></div></article>';
  });
  return h;
}
function tab3(){
  let h='<div class="note">기출 구성 그대로 <b>약술 5 + 서술 2</b>. 답을 머릿속으로 한 줄 써 보고 눌러서 채점 기준과 비교해 보기.</div>';
  QS.forEach(function(q,i){
    const id="q"+i;
    const on=!!S.ans[id];
    h+='<div class="q'+(on?' on':'')+'" data-id="'+id+'">';
    h+='<div class="qtop"><span class="qk">'+q.k+'</span><span class="qn">'+q.n+'번</span></div>';
    h+='<p>'+fmt(q.q)+'</p>';
    if(q.skel){
      h+='<ul class="skel">';
      q.skel.forEach(function(s){h+='<li>'+fmt(s)+'</li>';});
      h+='</ul>';
    }
    h+='<button class="qbtn">'+(on?"채점 기준 접기":"채점 기준 보기")+'</button>';
    h+='<div class="ans">'+fmt(q.a)+'<span class="hint">⚠ '+fmt(q.hint)+'</span></div>';
    h+='</div>';
  });
  return h;
}
function stickTop(){
  const t=document.querySelector(".tabs");
  if(!t) return;
  const b=Math.round(t.getBoundingClientRect().bottom);
  document.documentElement.style.setProperty("--stick",b+"px");
}
function render(){
  const app=document.getElementById("app");
  if(TAB===1) app.innerHTML=tab1();
  else if(TAB===2) app.innerHTML=tab2();
  else app.innerHTML=tab3();
  stickTop();
}
function dday(){
  const exam=new Date("2026-12-08T12:00:00+09:00").getTime();
  const now=Date.now();
  const d=Math.ceil((exam-now)/86400000);
  if(d>0) return "D-"+d;
  if(d===0) return "D-DAY";
  return "종료";
}
function applyTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content",t==="dark"?"#0b0d0f":"#fcfbf7");
}
document.getElementById("tabs").addEventListener("click",function(e){
  const b=e.target.closest(".tab");
  if(!b) return;
  TAB=parseInt(b.getAttribute("data-t"),10)||1;
  document.querySelectorAll(".tab").forEach(function(x){x.classList.toggle("on",x===b);});
  render();
  window.scrollTo({top:0,behavior:"smooth"});
});
document.getElementById("app").addEventListener("click",function(e){
  const trm=e.target.closest(".trm");
  if(trm){
    if(!S.mem) return;
    const id=trm.getAttribute("data-id");
    if(S.open[id]) delete S.open[id];
    else S.open[id]=true;
    save();
    trm.classList.toggle("hid",!S.open[id]);
    return;
  }
  const more=e.target.closest(".more");
  if(more){
    const wi=more.getAttribute("data-w");
    if(S.week[wi]) delete S.week[wi];
    else S.week[wi]=true;
    save();
    render();
    return;
  }
  const mem=e.target.closest("#mem");
  if(mem){S.mem=!S.mem;save();render();return;}
  const allw=e.target.closest("#allw");
  if(allw){
    if(!S.mem){S.mem=true;S.open={};}
    else{
      let hidden=false;
      WEEKS.forEach(function(w,wi){w.items.forEach(function(x,i){if(!S.open[wi+"-"+i]) hidden=true;});});
      if(hidden){WEEKS.forEach(function(w,wi){w.items.forEach(function(x,i){S.open[wi+"-"+i]=true;});});}
      else{S.open={};}
    }
    save();render();return;
  }
  const q=e.target.closest(".q");
  if(q){
    const id=q.getAttribute("data-id");
    if(S.ans[id]) delete S.ans[id];
    else S.ans[id]=true;
    save();
    q.classList.toggle("on",!!S.ans[id]);
    const btn=q.querySelector(".qbtn");
    if(btn) btn.textContent=S.ans[id]?"채점 기준 접기":"채점 기준 보기";
    return;
  }
});
document.getElementById("app").addEventListener("keydown",function(e){
  const trm=e.target.closest(".trm");
  if(!trm) return;
  if(e.key==="Enter"||e.key===" "){e.preventDefault();trm.click();}
});
document.getElementById("th").addEventListener("click",function(){
  const cur=document.documentElement.getAttribute("data-theme")==="dark"?"dark":"light";
  const next=cur==="dark"?"light":"dark";
  S.theme=next;
  applyTheme(next);
  save();
});
load();
let th=S.theme;
if(!th) th=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
applyTheme(th);
document.getElementById("dd").textContent=dday();
render();
window.addEventListener("resize",stickTop);
</script>
</body>
</html>
