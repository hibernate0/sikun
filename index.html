function sheetAdd(){
sheetOpen(`<p class="xs">${SL[SH.sl]}</p><h2 style="font-size:26px;font-weight:300;letter-spacing:-.04em;margin:4px 0 14px">먹은 음식 추가</h2><div class="srch"><input class="in" id="aq" placeholder="메뉴 검색"></div><div class="lst" id="alist">${addList('')}</div><div style="margin-top:20px">${btn('addcustom','','목록에 없으면 직접 입력','pillbtn ghost')}</div>`)}

function sheetCustom(){
const f=(id,l,t,ph)=>`<label class="fld"><span>${l}</span><input class="in" id="${id}" type="${t}" ${t==='number'?'inputmode="decimal"':''} placeholder="${ph||''}"></label>`;

function sheetWx(){sheetOpen(`<h2 style="font-size:26px;font-weight:300;letter-spacing:-.04em;margin:4px 0 6px">오늘 날씨</h2><p class="sm">기온에 맞춰 따뜻한 음식과 시원한 음식을 골라요.</p><div class="lst" style="margin-top:10px">${[['추워요',3],['쌀쌀해요',10],['선선해요',17],['따뜻해요',23],['더워요',29]].map(a=>`<div class="li" data-a="wxset" data-t="${a[1]}"><div class="nm"><b>${a[0]}</b></div><span class="sm">${a[1]}° 안팎</span></div>`).join('')}</div><div style="margin-top:18px">${btn('geo','','위치로 자동 반영','pillbtn ghost')}</div>`)}
function setPath(p,v){const ks=p.split('.');let o=S;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];const k=ks[ks.length-1];o[k]=v}

function dirty(){S.picks={};FC=null;FK=''}
function logAdd(o){S.log.push(Object.assign({id:'e'+Date.now()+Math.floor(Math.random()*999),d:dstr(),s:1},o))}
const ACT={
tab(d){tab=d.v;window.scrollTo(0,0);render()},
ftab(d){ftab=d.v;render()},
set(d){let v=d.v;if(d.p==='prefs.zasi')v=+v;if(d.p==='profile.body.act')v=+v;setPath(d.p,v);dirty();save();refresh(true)},
meth(d){const m=S.prefs.methods,i=m.indexOf(d.v);if(i>=0){if(m.length>1)m.splice(i,1)}else m.push(d.v);S.picks={};save();refresh(true)},
open(d){SH={id:d.id,sl:d.sl||'l',n:1};sheetMenu()},
close(){sheetClose()},
sv(d){SH.n=Math.max(.5,Math.round((SH.n+ +d.d)*2)/2);sheetMenu()},
slot(d){SH.sl=d.v;sheetMenu()},
swap(d){S.picks[dstr()+SH.sl]={id:d.id,skip:[]};save();sheetClose();render()},
refresh(d){const k=dstr()+d.sl,pk=S.picks[k];const skip=(pk&&pk.skip||[]).concat(pk?[pk.id]:[]);const rk=rank(d.sl,ctx()),n=rk.find(r=>!skip.includes(r.it.id))||rk[0];S.picks[k]={id:n?n.it.id:'',skip:n&&rk.length>skip.length?skip:[]};save();refresh(true)},
eat(d){const ex=S.log.find(e=>e.d===dstr()&&e.sl===d.sl&&e.mid===d.id);if(ex){S.log=S.log.filter(e=>e!==ex);toast('기록을 취소했어요')}else{const it=findMenu(d.id);if(!it)return;logAdd(Object.assign({sl:d.sl,n:it.name,mid:it.id},sc(it,1)));toast('기록했어요')}save();refresh(true)},
logit(){const it=findMenu(SH.id);if(!it)return;logAdd(Object.assign({sl:SH.sl,n:it.name,mid:it.id,s:SH.n},sc(it,SH.n)));save();sheetClose();toast('기록했어요');render()},
logdel(d){S.log=S.log.filter(e=>e.id!==d.id);save();refresh(true)},
add(d){SH={sl:d.sl,n:1};sheetAdd()},
addcustom(){SH=SH||{sl:'l',n:1};sheetCustom()},

mslot(d){mslot=d.v;render()},
mmeth(d){mmeth=d.v;render()},
wx(){sheetWx()},
wxset(d){S.wx={t:+d.t,d:dstr()};S.picks={};save();sheetClose();render()},

copy(){const t=JSON.stringify(S);if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('복사했어요'),()=>toast('복사하지 못했어요'));else toast('복사하지 못했어요')},
reset(){sheetReset()},
reset2(){try{localStorage.removeItem(KEY)}catch(e){}S=defaults();dirty();sheetClose();render()}
};

try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+g.lat.toFixed(2)+'&longitude='+g.lon.toFixed(2)+'&current=temperature_2m&timezone=auto');const j=await r.json();g.temp=j.current.temperature_2m}catch(e){}}

render();
